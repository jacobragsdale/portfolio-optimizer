<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-label="Two lanes. The run's main process: resolve config, start the cluster without blocking, load, assemble, wait for the first worker, share the run data once; then submit every build, gather the build summaries, derive the dependency graph, submit every solve with its predecessors' contributions as dependencies, classify outcomes in solve order as they complete, close the cluster, and persist, publish, and write the manifest. The workers: warm up, receive the shared data once, then build every portfolio at once (slice, rules, solve-order key, spec), summarize it, and later solve it where the build lives: fold the predecessors' buys, solve, verify, round to orders, and hand a contribution to the dependents. The graph derivation is outlined as the one serial step.">
  <style>
    svg { color: #1a211f; font-family: "IBM Plex Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .accent { stroke: #1f6f78; }
    .accent-text { fill: #1f6f78; }
    .hot { stroke: #b8432f; }
    @media (prefers-color-scheme: dark) {
      svg { color: #e6ebe9; }
      .accent { stroke: #63bcc4; }
      .accent-text { fill: #63bcc4; }
      .hot { stroke: #e8785f; }
    }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .lane { fill: none; stroke: currentColor; stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.5; }
    .label { fill: currentColor; text-anchor: middle; }
    .note { fill: currentColor; font-size: 10.5px; opacity: 0.75; text-anchor: middle; }
    .free { fill: currentColor; font-size: 11px; }
    .dim { fill: currentColor; font-size: 11px; opacity: 0.75; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1; marker-end: url(#head); }
    .flow { fill: none; stroke: currentColor; stroke-width: 1; opacity: 0.6; marker-end: url(#head); }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor" />
    </marker>
  </defs>

  <!-- main process lane -->
  <rect class="lane" x="20" y="24" width="1060" height="176" rx="6" />
  <text class="free" x="32" y="42">main process — one per run; loaders on an asyncio loop, everything else one thread</text>

  <!-- row 1: up to sharing the run data -->
  <rect class="box" x="32" y="56" width="120" height="40" rx="4" /><text class="label" x="92" y="80">resolve config</text>
  <rect class="box" x="164" y="56" width="128" height="40" rx="4" /><text class="label" x="228" y="74">start cluster</text><text class="note" x="228" y="88">non-blocking</text>
  <rect class="box" x="304" y="56" width="104" height="40" rx="4" /><text class="label" x="356" y="74">load</text><text class="note" x="356" y="88">async</text>
  <rect class="box" x="420" y="56" width="116" height="40" rx="4" /><text class="label" x="478" y="74">assemble</text><text class="note" x="478" y="88">once</text>
  <rect class="box" x="548" y="56" width="128" height="40" rx="4" /><text class="label" x="612" y="80">wait ≥ 1 worker</text>
  <rect class="box" x="688" y="56" width="104" height="40" rx="4" /><text class="label" x="740" y="74">share</text><text class="note" x="740" y="88">once</text>
  <path class="flow" d="M152,76 L164,76" /><path class="flow" d="M292,76 L304,76" /><path class="flow" d="M408,76 L420,76" /><path class="flow" d="M536,76 L548,76" /><path class="flow" d="M676,76 L688,76" />
  <path class="flow" d="M792,76 L820,76 L820,112 L32,112 L32,128" />

  <!-- row 2: the schedule -->
  <rect class="box" x="32" y="128" width="132" height="44" rx="4" /><text class="label" x="98" y="146">submit every build</text><text class="note" x="98" y="160">all at once, chain-free</text>
  <rect class="box" x="176" y="128" width="132" height="44" rx="4" /><text class="label" x="242" y="146">gather summaries</text><text class="note" x="242" y="160">key · buyable ids</text>
  <rect class="box hot" x="320" y="128" width="132" height="44" rx="4" /><text class="label" x="386" y="146">derive the graph</text><text class="note" x="386" y="160">who waits for whom</text>
  <rect class="box" x="464" y="128" width="148" height="44" rx="4" /><text class="label" x="538" y="146">submit every solve</text><text class="note" x="538" y="160">+ predecessors' contributions</text>
  <rect class="box" x="624" y="128" width="148" height="44" rx="4" /><text class="label" x="698" y="146">classify in solve order</text><text class="note" x="698" y="160">persist as each arrives</text>
  <rect class="box" x="784" y="128" width="104" height="44" rx="4" /><text class="label" x="836" y="146">close</text><text class="note" x="836" y="160">finally</text>
  <rect class="box hot" x="900" y="128" width="168" height="44" rx="4" /><text class="label" x="984" y="146">persist</text><text class="note" x="984" y="160">sink · manifest</text>
  <path class="flow" d="M164,150 L176,150" /><path class="flow" d="M308,150 L320,150" /><path class="flow" d="M452,150 L464,150" /><path class="flow" d="M612,150 L624,150" /><path class="flow" d="M772,150 L784,150" /><path class="flow" d="M888,150 L900,150" />
  <text class="dim" x="330" y="190">the one serial step in the main process: a few milliseconds per thousand portfolios</text>

  <!-- between the lanes -->
  <path class="arrow accent" d="M740,96 L740,244" /><text class="accent-text free" x="748" y="230">shared run data: datasets + config — once per worker, never per task</text>
  <path class="arrow accent" d="M80,172 L80,244" /><text class="accent-text free" x="88" y="206">build(portfolio_id)</text>
  <path class="arrow accent" d="M260,244 L260,172" /><text class="accent-text free" x="268" y="206">summary + environment fingerprint</text>
  <path class="arrow accent" d="M520,172 L520,244" /><text class="accent-text free" x="528" y="206">solve waits for its predecessors</text>
  <path class="arrow accent" d="M680,244 L680,172" /><text class="accent-text free" x="688" y="206">results as they complete</text>

  <!-- workers lane -->
  <rect class="lane" x="20" y="244" width="1060" height="160" rx="6" />
  <text class="free" x="32" y="262">workers — the run's own Dask cluster: worker processes on a laptop, pods on Kubernetes, the same tasks either way</text>
  <rect class="box" x="32" y="276" width="120" height="44" rx="4" /><text class="label" x="92" y="294">warm up</text><text class="note" x="92" y="308">import cvxpy under load</text>
  <rect class="box" x="164" y="276" width="120" height="44" rx="4" /><text class="label" x="224" y="294">keep shared data</text><text class="note" x="224" y="308">replicated on demand</text>
  <rect class="box" x="296" y="276" width="176" height="44" rx="4" /><text class="label" x="384" y="294">build</text><text class="note" x="384" y="308">slice → rules → key → spec</text>
  <rect class="box" x="484" y="276" width="104" height="44" rx="4" /><text class="label" x="536" y="294">summarize</text><text class="note" x="536" y="308">spec stays here</text>
  <rect class="box" x="600" y="276" width="220" height="44" rx="4" /><text class="label" x="710" y="294">solve, where the build lives</text><text class="note" x="710" y="308">fold predecessors' buys → solve → verify → orders</text>
  <rect class="box" x="832" y="276" width="120" height="44" rx="4" /><text class="label" x="892" y="294">contribution</text><text class="note" x="892" y="308">BUY rows only</text>
  <path class="flow" d="M472,298 L484,298" /><path class="flow" d="M588,298 L600,298" /><path class="flow" d="M820,298 L832,298" />
  <path class="flow" d="M952,298 L980,298 L980,340 L640,340 L640,320" />
  <text class="dim" x="32" y="362">every build at once; a solve starts the moment its last predecessor's contribution exists — the graph, not the main process, is the barrier</text>
  <text class="dim" x="32" y="384">a portfolio sees only what higher-priority portfolios bought among the securities it can buy; sells never reach anyone</text>
</svg>
