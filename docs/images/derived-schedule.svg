<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" role="img" aria-label="Two views of one book of eight accounts, P1 to P8 in solve order. Top: the safe reading, dependencies all — every account waits for every earlier one, drawn as a chain of eight solves; twenty-eight edges, one component, critical path eight. Bottom: the derived schedule, dependencies overlap — each account carries its mandate (tech, health, or utilities) and waits only for earlier accounts that can trade a name it can trade too. Nine edges, three components, critical path three, highlighted through P1, P3, P6. A test asserts both schedules produce identical orders and identical chain hashes.">
  <style>
    svg { color: #1a211f; font-family: "IBM Plex Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .accent { stroke: #1f6f78; }
    .accent-text { fill: #1f6f78; }
    .hot { stroke: #b8432f; }
    .hot-text { fill: #b8432f; }
    @media (prefers-color-scheme: dark) {
      svg { color: #e6ebe9; }
      .accent { stroke: #63bcc4; }
      .accent-text { fill: #63bcc4; }
      .hot { stroke: #e8785f; }
      .hot-text { fill: #e8785f; }
    }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .lane { fill: none; stroke: currentColor; stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.5; }
    .label { fill: currentColor; text-anchor: middle; }
    .note { fill: currentColor; font-size: 10.5px; opacity: 0.75; text-anchor: middle; }
    .free { fill: currentColor; font-size: 11px; }
    .dim { fill: currentColor; font-size: 11px; opacity: 0.75; }
    .edge { fill: none; stroke: currentColor; stroke-width: 1; opacity: 0.7; marker-end: url(#head); }
    .edge-hot { fill: none; stroke-width: 1.6; marker-end: url(#head-hot); }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor" />
    </marker>
    <marker id="head-hot" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#b8432f" />
    </marker>
  </defs>

  <!-- top lane: the line -->
  <rect class="lane" x="20" y="20" width="1060" height="150" rx="6" />
  <text class="free" x="32" y="40">dependencies: all — the safe reading: every account waits for every earlier one</text>

  <!-- nodes P1..P8, chained -->
  <g>
    <rect class="box" x="60"  y="72" width="72" height="40" rx="4" /><text class="label" x="96"  y="96">P1</text>
    <rect class="box" x="190" y="72" width="72" height="40" rx="4" /><text class="label" x="226" y="96">P2</text>
    <rect class="box" x="320" y="72" width="72" height="40" rx="4" /><text class="label" x="356" y="96">P3</text>
    <rect class="box" x="450" y="72" width="72" height="40" rx="4" /><text class="label" x="486" y="96">P4</text>
    <rect class="box" x="580" y="72" width="72" height="40" rx="4" /><text class="label" x="616" y="96">P5</text>
    <rect class="box" x="710" y="72" width="72" height="40" rx="4" /><text class="label" x="746" y="96">P6</text>
    <rect class="box" x="840" y="72" width="72" height="40" rx="4" /><text class="label" x="876" y="96">P7</text>
    <rect class="box" x="970" y="72" width="72" height="40" rx="4" /><text class="label" x="1006" y="96">P8</text>
    <path class="edge" d="M132,92 L188,92" /><path class="edge" d="M262,92 L318,92" /><path class="edge" d="M392,92 L448,92" />
    <path class="edge" d="M522,92 L578,92" /><path class="edge" d="M652,92 L708,92" /><path class="edge" d="M782,92 L838,92" /><path class="edge" d="M912,92 L968,92" />
    <path class="edge" d="M96,72 C 250,36 460,36 614,70" />
    <path class="edge" d="M486,112 C 640,148 850,148 1004,114" />
  </g>
  <text class="note" x="356" y="52">…and every account before those (28 edges; two drawn)</text>
  <text class="dim" x="32" y="156">28 edges · 1 component · critical path 8 — wall clock ≈ 8 solves end to end</text>

  <!-- bottom lane: the derived graph -->
  <rect class="lane" x="20" y="190" width="1060" height="186" rx="6" />
  <text class="free" x="32" y="210">dependencies: overlap — derived: wait only for earlier accounts that can trade a name you can trade</text>

  <!-- same accounts, mandates shown; edges only within a mandate -->
  <g>
    <rect class="box accent" x="60"  y="242" width="72" height="46" rx="4" /><text class="label" x="96"  y="262">P1</text><text class="note accent-text" x="96"  y="278">tech</text>
    <rect class="box" x="190" y="242" width="72" height="46" rx="4" /><text class="label" x="226" y="262">P2</text><text class="note" x="226" y="278">health</text>
    <rect class="box accent" x="320" y="242" width="72" height="46" rx="4" /><text class="label" x="356" y="262">P3</text><text class="note accent-text" x="356" y="278">tech</text>
    <rect class="box" x="450" y="242" width="72" height="46" rx="4" /><text class="label" x="486" y="262">P4</text><text class="note" x="486" y="278">util</text>
    <rect class="box" x="580" y="242" width="72" height="46" rx="4" /><text class="label" x="616" y="262">P5</text><text class="note" x="616" y="278">health</text>
    <rect class="box accent" x="710" y="242" width="72" height="46" rx="4" /><text class="label" x="746" y="262">P6</text><text class="note accent-text" x="746" y="278">tech</text>
    <rect class="box" x="840" y="242" width="72" height="46" rx="4" /><text class="label" x="876" y="262">P7</text><text class="note" x="876" y="278">util</text>
    <rect class="box" x="970" y="242" width="72" height="46" rx="4" /><text class="label" x="1006" y="262">P8</text><text class="note" x="1006" y="278">health</text>

    <!-- tech: P1 -> P3 -> P6, plus the direct P1 -> P6 (never transitively reduced) -->
    <path class="edge-hot hot" d="M132,258 C 190,238 262,238 318,256" />
    <path class="edge-hot hot" d="M392,258 C 490,232 612,232 708,256" />
    <path class="edge" d="M96,242 C 280,196 560,196 742,240" />
    <!-- health: P2 -> P5 -> P8, plus P2 -> P8 -->
    <path class="edge" d="M262,272 C 360,296 520,296 578,274" />
    <path class="edge" d="M652,272 C 750,296 910,296 968,274" />
    <path class="edge" d="M226,288 C 460,344 780,344 1002,290" />
    <!-- utilities: P4 -> P7 -->
    <path class="edge" d="M522,258 C 630,234 730,234 838,256" />
  </g>
  <text class="dim" x="32" y="362">9 edges · 3 components · <tspan class="hot-text">critical path 3</tspan> — wall clock ≈ 3 solves, and the components solve at once</text>
  <text class="dim" x="620" y="362">same orders, same chain hashes as the line — a test holds the two equal</text>
</svg>
