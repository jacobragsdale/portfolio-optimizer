<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" role="img" aria-label="Two lanes on a shared time axis. The run lane: resolve config, then provision the cluster without blocking, then the slow asynchronous load, assemble, wait for the first worker, scatter shared data, submit a window and consume in order, tear down, then persist and write the manifest. The cluster lane underneath: the scheduler pod starts during load, workers join while load continues, the run scales to its maximum after assembly, tasks run, pods are deleted at tear down. The run only blocks on the cluster if load finished before the first worker was ready.">
  <style>
    svg { color: #1a211f; font-family: "IBM Plex Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
    .accent { stroke: #1f6f78; }
    @media (prefers-color-scheme: dark) {
      svg { color: #e6ebe9; }
      .accent { stroke: #63bcc4; }
    }
    .box { fill: none; stroke: currentColor; stroke-width: 1.2; }
    .label { fill: currentColor; text-anchor: middle; }
    .note { fill: currentColor; font-size: 10px; opacity: 0.75; text-anchor: middle; }
    .dim { fill: currentColor; font-size: 12px; opacity: 0.75; }
    .small { fill: currentColor; font-size: 10.5px; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.2; marker-end: url(#arrow2); }
    .guide { stroke: currentColor; stroke-dasharray: 2 3; opacity: 0.45; }
  </style>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <text class="dim" x="20" y="48">run — client process</text>
  <text class="dim" x="20" y="190">cluster — scheduler pod + worker pods, this run's image</text>
  <line class="guide" x1="130" y1="30" x2="130" y2="300"/>
  <line class="guide" x1="700" y1="30" x2="700" y2="300"/>
  <line class="guide" x1="940" y1="30" x2="940" y2="300"/>

  <rect class="box" x="30" y="62" width="90" height="40" rx="3"/>
  <rect class="box accent" x="130" y="62" width="150" height="40" rx="3" stroke-width="1.8"/>
  <rect class="box" x="290" y="62" width="210" height="40" rx="3"/>
  <rect class="box" x="510" y="62" width="80" height="40" rx="3"/>
  <rect class="box accent" x="600" y="62" width="100" height="40" rx="3" stroke-width="1.8"/>
  <rect class="box" x="710" y="62" width="60" height="40" rx="3"/>
  <rect class="box" x="780" y="62" width="150" height="40" rx="3"/>
  <rect class="box accent" x="940" y="62" width="60" height="40" rx="3" stroke-width="1.8"/>
  <rect class="box" x="1010" y="62" width="70" height="40" rx="3"/>
  <text class="label" x="75" y="80">resolve</text><text class="note" x="75" y="94">config</text>
  <text class="label" x="205" y="80">provision</text><text class="note" x="205" y="94">non-blocking · min_workers</text>
  <text class="label" x="395" y="80">load</text><text class="note" x="395" y="94">async loaders · the slow part</text>
  <text class="label" x="550" y="80">assemble</text>
  <text class="label" x="650" y="80">wait ≥ 1</text><text class="note" x="650" y="94">worker · timeout</text>
  <text class="label" x="740" y="80">scatter</text>
  <text class="label" x="855" y="80">submit W · consume</text><text class="note" x="855" y="94">in solve order</text>
  <text class="label" x="970" y="80">tear</text><text class="note" x="970" y="94">down</text>
  <text class="label" x="1045" y="80">persist</text><text class="note" x="1045" y="94">manifest</text>
  <line class="arrow" x1="120" y1="82" x2="128" y2="82"/>
  <line class="arrow" x1="280" y1="82" x2="288" y2="82"/>
  <line class="arrow" x1="500" y1="82" x2="508" y2="82"/>
  <line class="arrow" x1="590" y1="82" x2="598" y2="82"/>
  <line class="arrow" x1="700" y1="82" x2="708" y2="82"/>
  <line class="arrow" x1="770" y1="82" x2="778" y2="82"/>
  <line class="arrow" x1="930" y1="82" x2="938" y2="82"/>
  <line class="arrow" x1="1000" y1="82" x2="1008" y2="82"/>

  <rect class="box" x="130" y="204" width="200" height="40" rx="3" stroke-dasharray="5 3"/>
  <rect class="box" x="330" y="204" width="370" height="40" rx="3" stroke-dasharray="5 3"/>
  <rect class="box" x="700" y="204" width="240" height="40" rx="3"/>
  <rect class="box" x="940" y="204" width="60" height="40" rx="3" stroke-dasharray="5 3"/>
  <text class="label" x="230" y="222">scheduler pod starting</text><text class="note" x="230" y="236">image pull · node warm-up</text>
  <text class="label" x="515" y="222">workers joining</text><text class="note" x="515" y="236">min_workers first · cvxpy import each</text>
  <text class="label" x="820" y="222">tasks run</text><text class="note" x="820" y="236">slice → rules → build (→ solve)</text>
  <text class="label" x="970" y="222">pods</text><text class="note" x="970" y="236">deleted</text>

  <line class="arrow accent" x1="590" y1="102" x2="590" y2="202" stroke-width="1.6"/>
  <text class="small" x="596" y="150">scale(max_workers)</text>
  <text class="small" x="596" y="164" opacity="0.75">the rest join on warm nodes</text>
  <text class="small" x="704" y="266">first worker ready</text>
  <text class="small" x="134" y="266">provision started</text>
  <text class="small" x="944" y="266">close()</text>
  <line class="accent" x1="130" y1="150" x2="500" y2="150" stroke-width="1.6"/>
  <line class="accent" x1="130" y1="145" x2="130" y2="155" stroke-width="1.6"/>
  <line class="accent" x1="500" y1="145" x2="500" y2="155" stroke-width="1.6"/>
  <text class="small" x="315" y="140" text-anchor="middle">cluster warm-up hidden under load; the run blocks at “wait” only for whatever is left</text>
  <line class="arrow" x1="30" y1="300" x2="1080" y2="300" opacity="0.6"/>
  <text class="small" x="1040" y="292" opacity="0.75">wall time</text>
</svg>
