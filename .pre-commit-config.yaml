repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-json

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.22   # keep in sync with the uv version the repo is built with
    hooks:
      - id: uv-lock   # fails the commit if pyproject.toml changed without uv.lock

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.75   # keep in sync with the pinned ty dev dependency
    hooks:
      - id: ty

  - repo: local
    hooks:
      - id: prettier-json
        name: prettier (json)
        entry: prettier --write
        language: node
        additional_dependencies: ["prettier@3.9.6"]
        types: [json]
        # Prettier 3.5+ `objectWrap: collapse` puts every object that fits in printWidth (95) on one line, so a small
        # step stays scannable on one and a dataset that declares a scope and a batch size breaks into named lines.
        # 95 rather than 120 because GitHub's blob view starts scrolling horizontally past about that.
